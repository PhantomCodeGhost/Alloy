      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="purpleRimSheen" x1="278" y1="745" x2="745" y2="278" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DDD6FE" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#F5D0FE" stop-opacity="0.8" />
    </linearGradient>

