<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Vibrant Blue Ribbon Gradient: Cobalt -> Royal Blue -> Deep Indigo -->
    <linearGradient id="blueRibbonGrad" x1="278" y1="278" x2="745" y2="745" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="28%" stop-color="#2563EB" />
      <stop offset="68%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Vibrant Purple Ribbon Gradient: Orchid -> Magenta -> Deep Violet -->
    <linearGradient id="purpleRibbonGrad" x1="278" y1="745" x2="745" y2="278" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4C1D95" />
      <stop offset="32%" stop-color="#7C3AED" />
      <stop offset="70%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Inner Rim Sheen Highlights -->
