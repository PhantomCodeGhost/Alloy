    <radialGradient id="bottomCrossingShadow" cx="512" cy="650" r="90" fx="512" fy="645" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.45" />
      <stop offset="55%" stop-color="#020617" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <clipPath id="clipBottomCrossing">
      <path d="M 377.00 650.00 C 377.00 575.44 437.44 515.00 512.00 515.00 C 586.56 515.00 647.00 575.44 647.00 650.00 C 647.00 724.56 586.56 785.00 512.00 785.00 C 437.44 785.00 377.00 724.56 377.00 650.00 Z " />
